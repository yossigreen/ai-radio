# Local development infrastructure. Start with `pnpm dev:infra`.
# Credentials here are local-only defaults; override them in .env (never commit .env).
name: ai-radio

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airadio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airadio-dev}
      POSTGRES_DB: ${POSTGRES_DB:-airadio}
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage, standing in for AWS S3 locally (ADR 0018).
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-airadio}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-airadio-dev-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['9000:9000', '9001:9001']
    volumes: ['rustfs-data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/health']
      interval: 2s
      timeout: 3s
      retries: 30

  # Temporal dev server (single binary, SQLite) with its web UI on :8233.
  temporal:
    image: temporalio/temporal:1.10.1
    command:
      ['server', 'start-dev', '--ip', '0.0.0.0', '--db-filename', '/home/temporal/temporal.db']
    ports: ['7233:7233', '8233:8233']
    # Mounted on the image's home dir so the volume inherits its non-root owner.
    volumes: ['temporal-data:/home/temporal']
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 2s
      timeout: 5s
      retries: 30

  # OpenTelemetry collector + Grafana, Loki, Tempo, Prometheus in one container (ADR 0014).
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports: ['3300:3000', '4317:4317', '4318:4318']
    volumes: ['lgtm-data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:3000/api/health']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  postgres-data:
  rustfs-data:
  temporal-data:
  lgtm-data:
